[project]
name = "ecg-course"
version = "0.1.0"
description = "Python companion for the ECG ML Curriculum: load, inspect and export one public PTB-XL record."
readme = "README.md"
authors = [
    { name = "Darren King", email = "medr2dev@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "wfdb>=4.3.1",
]

[project.scripts]
ecg-course = "ecg_course.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.ruff.lint.per-file-ignores]
# The lesson script deliberately imports inside each snippet so that every
# snippet shown on the lesson page is self-contained.
"examples/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
